<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Platform - 華寶 (AI助理系統)</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: '#000093', /* 藍色 Blue-600 */
                        primaryHover: '#000079', /* Blue-700 */
                        background: '#F3F4F6', /* 淺灰 Gray-100 */
                        surface: '#FFFFFF', /* 純白 White */
                        border: '#E5E7EB', /* 邊框 Gray-200 */
                        text: '#1F2937', /* 標題 Gray-800 */
                        textMuted: '#6B7280', /* 說明 Gray-500 */
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Sidebar 共用樣式 -->
    <link rel="stylesheet" href="css/sidebar.css">

    <style>
        body {
            background-color: #F3F4F6;
            color: #1F2937;
        }

        *:focus-visible {
            outline: 2px solid #2563EB;
            outline-offset: 2px;
        }

        /* 隱藏原生滾動條但保持可滾動 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Toast Animation */
        #toast {
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
    </style>
</head>

            [貼入此 component 的內容]

        </div>
    </header>
-->

    <script src="js/mock-data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatContainer = document.getElementById('chatContainer');
            const chatInput = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');
            const contextSelect = document.getElementById('contextSelect');

            function getCurrentTime() {
                const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                return `今天 ${hours}:${minutes}`;
            }

            function appendMessage(text, isUser = false, sources = []) {
                const time = getCurrentTime();
                const bubble = document.createElement('div');
                bubble.className = isUser ? "flex items-start justify-end" : "flex items-start";

                if (isUser) {
                    bubble.innerHTML = `
                        <div class="flex-1 max-w-[85%] sm:max-w-[75%] flex flex-col items-end">
                            <div class="bg-primary text-white rounded-2xl rounded-tr-sm p-4 shadow-sm text-sm leading-relaxed">
                                <p>${text}</p>
                            </div>
                            <div class="text-xs text-textMuted mt-2 mr-1 font-medium">${time}</div>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-primary ml-4 flex-shrink-0 shadow-md ring-4 ring-blue-50 font-bold">
                            G
                        </div>
                    `;
                } else {
                    let sourcesHtml = '';
                    if (sources && sources.length > 0) {
                        const badges = sources.map((source, index) => `
                            <a href="${source.link || 'assistant-files.html'}" target="_blank" class="inline-flex items-center space-x-2 px-3 py-1.5 rounded-full text-[11px] font-bold bg-blue-50 text-primary border border-blue-100 hover:bg-primary hover:text-white transition-all shadow-sm group">
                                <i data-lucide="file-search" class="w-3.5 h-3.5 text-primary group-hover:text-white transition-colors"></i>
                                <span>${index + 1}. ${source.keyword || '相關文件'}</span>
                            </a>
                        `).join('');

                        sourcesHtml = `
                            <div class="mt-4 pt-3 border-t border-gray-100 flex flex-wrap gap-2">
                                ${badges}
                            </div>
                        `;
                    }

                    bubble.innerHTML = `
                        <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white mr-4 flex-shrink-0 shadow-md ring-4 ring-blue-50">
                            <i data-lucide="bot" class="w-5 h-5"></i>
                        </div>
                        <div class="flex-1 max-w-[85%] sm:max-w-[75%]">
                            <div class="bg-white border border-border rounded-2xl rounded-tl-sm p-4 shadow-sm text-sm text-text leading-relaxed">
                                <p>${text}</p>
                                ${sourcesHtml}
                            </div>
                            <div class="text-xs text-textMuted mt-2 ml-1 font-medium">${time}</div>
                        </div>
                    `;
                }

                chatContainer.appendChild(bubble);

                // Re-create lucide icons for the new bubble
                if (!isUser) {
                    lucide.createIcons();
                }

                // Scroll to bottom
                chatContainer.scrollTo({
                    top: chatContainer.scrollHeight,
                    behavior: 'smooth'
                });
            }

            const toast = document.getElementById('toast');

            function showToast() {
                toast.classList.remove('-translate-y-20', 'opacity-0', 'pointer-events-none');
                toast.classList.add('translate-y-0', 'opacity-100');

                setTimeout(() => {
                    toast.classList.add('-translate-y-20', 'opacity-0', 'pointer-events-none');
                    toast.classList.remove('translate-y-0', 'opacity-100');
                }, 3000);
            }

            function handleSendMessage() {
                // 0. Validation: Must select a context
                if (!contextSelect.value) {
                    showToast();
                    return;
                }

                const text = chatInput.value.trim();
                if (!text) return;

                // 1. Append User Message
                appendMessage(text, true);
                chatInput.value = '';

                // 2. Simulate AI thinking and reply after 1s
                setTimeout(() => {
                    // Check for keywords first
                    let response = "";
                    let sources = [];
                    const matchedKeyword = AI_MOCK_DATA.keywordMappings.find(kr =>
                        kr.keywords.some(k => text.includes(k))
                    );

                    if (matchedKeyword) {
                        response = matchedKeyword.response;
                        sources = matchedKeyword.sources || [];
                    } else {
                        const context = contextSelect.value || 'default';
                        response = AI_MOCK_DATA.responses[context] || AI_MOCK_DATA.responses['default'];
                    }

                    appendMessage(response, false, sources);
                }, 1000);
            }

            sendBtn.addEventListener('click', handleSendMessage);

            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleSendMessage();
                }
            });
        });
    </script>
    <script src="js/components.js"></script>
</body>

</html>
