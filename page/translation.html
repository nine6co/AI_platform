<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Platform - 文件翻譯</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: '#000093', /* 藍色 Blue-600 */
                        primaryHover: '#000079', /* Blue-700 */
                        background: '#F3F4F6', /* 淺灰 Gray-100 */
                        surface: '#FFFFFF', /* 純白 White */
                        border: '#E5E7EB', /* 邊框 Gray-200 */
                        text: '#1F2937', /* 標題 Gray-800 */
                        textMuted: '#6B7280', /* 說明 Gray-500 */
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Sidebar 共用樣式 -->
    <link rel="stylesheet" href="css/sidebar.css">

    <style>
        body {
            background-color: #F3F4F6;
            color: #1F2937;
        }

        *:focus-visible {
            outline: 2px solid #2563EB;
            outline-offset: 2px;
        }
    </style>
</head>

<body class="flex h-screen overflow-hidden antialiased" data-page="translation">
    <!-- Sidebar Component (動態載入) -->
    <!-- components/sidebar.html — 共用側邊欄，由 js/components.js 動態載入 -->
<aside id="sidebar"
    class="sidebar w-64 bg-surface border-r border-border flex flex-col h-full flex-shrink-0 z-20 relative transition-all duration-300">

    <!-- Sidebar Toggle Button -->
    <button id="sidebarToggle"
        class="absolute -right-3 top-7 w-6 h-6 bg-white border border-border rounded-full flex items-center justify-center text-textMuted hover:text-primary hover:border-primary shadow-sm z-30 transition-colors">
        <i data-lucide="chevron-left" class="w-4 h-4 transition-transform duration-300" id="sidebarToggleIcon"></i>
    </button>

    <!-- Logo Area -->
    <div class="sidebar-header h-20 flex items-center px-6 border-b border-border transition-all duration-300">
        <div
            class="sidebar-logo w-10 h-10 mr-3 flex-shrink-0 flex items-center justify-center transition-all duration-300">
            <img src="img/logo.png" alt="AI Platform Logo" class="w-full h-full object-contain">
        </div>
        <h1 class="text-xl font-bold tracking-tight text-primary sidebar-text pl-1">AI Platform</h1>
    </div>

    <!-- Navigation Links -->
    <nav class="flex-1 py-6 px-4 space-y-2 overflow-y-auto overflow-x-hidden">

        <!-- 儀表版 -->
        <a id="nav-dashboard" href="index.html"
            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-textMuted hover:bg-gray-100 hover:text-primary transition-colors group cursor-pointer">
            <i data-lucide="layout-dashboard"
                class="w-5 h-5 text-textMuted group-hover:text-primary transition-colors flex-shrink-0"></i>
            <span class="font-medium sidebar-text pl-3">儀表版</span>
        </a>

        <!-- AI 應用入口 Group — class 由 components.js 動態設定 -->
        <div id="nav-group" class="flex flex-col space-y-1">

            <!-- 主分類（index 頁面 active 由 JS 設定） -->
            <a id="nav-main" href="index.html"
                class="sidebar-item flex items-center justify-between px-4 py-3 rounded-lg text-textMuted hover:bg-gray-100 hover:text-primary transition-colors group cursor-pointer">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <i data-lucide="sparkles" class="w-5 h-5 text-textMuted group-hover:text-primary flex-shrink-0"></i>
                    <span class="font-bold sidebar-text pl-3">生成式AI應用入口</span>
                </div>
                <i data-lucide="chevron-down" class="w-4 h-4 text-textMuted flex-shrink-0 sidebar-arrow"></i>
            </a>

            <!-- Sub-menu -->
            <div class="sidebar-sub-container ml-5 border-l border-border mt-1 flex flex-col space-y-1 transition-all">

                <!-- 華寶 (AI助理系統) -->
                <a href="assistant.html" data-nav-key="assistant"
                    class="sidebar-item sidebar-sub-item flex items-center space-x-3 px-4 py-2.5 rounded-lg text-textMuted hover:bg-gray-100 hover:text-primary transition-colors group cursor-pointer ml-1">
                    <i data-lucide="bot"
                        class="w-4 h-4 text-textMuted group-hover:text-primary transition-colors flex-shrink-0"></i>
                    <span class="font-medium text-[13px] sidebar-text pl-3">華寶 (AI助理系統)</span>
                </a>

                <!-- 文件翻譯 -->
                <a href="translation.html" data-nav-key="translation"
                    class="sidebar-item sidebar-sub-item flex items-center space-x-3 px-4 py-2.5 rounded-lg text-textMuted hover:bg-gray-100 hover:text-primary transition-colors group cursor-pointer ml-1">
                    <i data-lucide="languages"
                        class="w-4 h-4 text-textMuted group-hover:text-primary transition-colors flex-shrink-0"></i>
                    <span class="font-medium text-[13px] sidebar-text pl-3">文件翻譯</span>
                </a>

                <!-- 語音會議記錄逐字稿 -->
                <a href="transcription.html" data-nav-key="transcription"
                    class="sidebar-item sidebar-sub-item flex items-center space-x-3 px-4 py-2.5 rounded-lg text-textMuted hover:bg-gray-100 hover:text-primary transition-colors group cursor-pointer ml-1">
                    <i data-lucide="mic"
                        class="w-4 h-4 text-textMuted group-hover:text-primary transition-colors flex-shrink-0"></i>
                    <span class="font-medium text-[13px] sidebar-text pl-3">語音會議記錄逐字稿</span>
                </a>

                <!-- 會議記錄整理 -->
                <a href="minutes.html" data-nav-key="minutes"
                    class="sidebar-item sidebar-sub-item flex items-center space-x-3 px-4 py-2.5 rounded-lg text-textMuted hover:bg-gray-100 hover:text-primary transition-colors group cursor-pointer ml-1">
                    <i data-lucide="file-text"
                        class="w-4 h-4 text-textMuted group-hover:text-primary transition-colors flex-shrink-0"></i>
                    <span class="font-medium text-[13px] sidebar-text pl-3">會議記錄整理</span>
                </a>

                <!-- 時事模擬情境 -->
                <a href="simulation.html" data-nav-key="simulation"
                    class="sidebar-item sidebar-sub-item flex items-center space-x-3 px-4 py-2.5 rounded-lg text-textMuted hover:bg-gray-100 hover:text-primary transition-colors group cursor-pointer ml-1">
                    <i data-lucide="lightbulb"
                        class="w-4 h-4 text-textMuted group-hover:text-primary transition-colors flex-shrink-0"></i>
                    <span class="font-medium text-[13px] sidebar-text pl-3">時事模擬情境</span>
                </a>

                <!-- 金融業法規摘要 -->
                <a href="regulations.html" data-nav-key="regulations"
                    class="sidebar-item sidebar-sub-item flex items-center space-x-3 px-4 py-2.5 rounded-lg text-textMuted hover:bg-gray-100 hover:text-primary transition-colors group cursor-pointer ml-1">
                    <i data-lucide="scale"
                        class="w-4 h-4 text-textMuted group-hover:text-primary transition-colors flex-shrink-0"></i>
                    <span class="font-medium text-[13px] sidebar-text pl-3">金融業法規摘要</span>
                </a>
            </div>
        </div>
    </nav>
</aside>

    <!-- Main Content Context -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative bg-background">

        <!-- 4. 用戶與系統資訊 (Top Bar) -->
        <header
            class="bg-surface h-20 px-8 flex items-center justify-between z-10 sticky top-0 border-b border-border shadow-sm">
            <div>
                <!-- 麵包屑/路徑管理 -->
                <nav class="flex items-center text-xs font-semibold text-textMuted mb-1.5">
                    <a href="index.html" class="hover:text-primary transition-colors cursor-pointer">生成式AI應用</a>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5 mx-1.5"></i>
                    <span class="text-primary">文件翻譯</span>
                </nav>
                <h2 class="text-2xl font-bold text-text flex items-center">
                    文件翻譯
                </h2>
            </div>

            <div class="flex items-center space-x-6">
                <!-- TopBar User Component (動態載入) -->
                <!--
    components/topbar-user.html
    ============================
    頂部列「右側」共用區塊：通知鈴 + 使用者 Profile

    使用說明：
    - 此 component 僅包含右側的「通知」與「使用者」區塊
    - 左側的 Breadcrumb 與頁面標題因頁面而異，請在各頁面自行定義
    - 將此 component 放在 <header> 內的 <div class="flex items-center space-x-6"> 裡面

    HTML 結構範例（各頁面的 header）：
    ─────────────────────────────────
    <header class="bg-surface h-20 px-8 flex items-center justify-between z-10 sticky top-0 border-b border-border shadow-sm">
        <div>
            [各頁面自定義：Breadcrumb + 頁面標題]
        </div>
        <div class="flex items-center space-x-6">
            [貼入此 component 的內容]
            [各頁面額外按鈕，如：檔案管理、搜尋框]
        </div>
    </header>
-->

<!-- Notification Button -->
<button
    class="relative p-2 rounded-full hover:bg-gray-100 transition-colors text-textMuted hover:text-primary cursor-pointer"
    aria-label="通知">
    <i data-lucide="bell" class="w-5 h-5"></i>
    <!-- 未讀紅點 -->
    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
</button>

<!-- User Profile Dropdown -->
<div class="relative" id="userMenuContainer">
    <!-- User Profile Display (Trigger) -->
    <div id="userMenuButton"
        class="flex items-center space-x-3 cursor-pointer p-1.5 pr-3 rounded-full hover:bg-gray-50 border border-transparent transition-all">
        <div class="w-9 h-9 rounded-full bg-blue-100 flex items-center justify-center text-primary font-bold">
            G
        </div>
        <div class="hidden md:flex flex-col">
            <span class="font-semibold text-sm leading-tight text-text">姓名</span>
            <span class="text-[8px] text-textMuted leading-tight">員工編號</span>
        </div>
        <i data-lucide="chevron-down" class="w-4 h-4 text-textMuted transition-transform duration-200"
            id="userMenuArrow"></i>
    </div>

    <!-- Dropdown Menu -->
    <div id="userDropdown"
        class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-border py-2 z-50 transform origin-top-right transition-all duration-200 opacity-0 -translate-y-2">
        <button id="logoutBtn"
            class="w-full flex items-center px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors cursor-pointer group">
            <i data-lucide="log-out" class="w-4 h-4 mr-3 group-hover:scale-110 transition-transform"></i>
            登出系統
        </button>
    </div>
</div>

<!-- Logout Confirmation Modal -->
<div id="logoutModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity" id="logoutModalBackdrop"></div>

    <!-- Modal Content -->
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 transform transition-all duration-300 opacity-0 scale-95"
        id="logoutModalContent">
        <div class="flex flex-col items-center text-center">
            <!-- Warning Icon -->
            <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center text-red-500 mb-6">
                <i data-lucide="alert-triangle" class="w-8 h-8"></i>
            </div>

            <h3 class="text-xl font-bold text-text mb-2">確認要登出系統嗎？</h3>
            <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4 w-full">
                <button id="logoutCancel"
                    class="flex-1 px-6 py-3 rounded-xl border border-border text-text font-semibold hover:bg-gray-50 transition-colors cursor-pointer">
                    取消
                </button>
                <button id="logoutConfirm"
                    class="flex-1 px-6 py-3 rounded-xl bg-red-500 text-white font-semibold hover:bg-red-600 shadow-lg shadow-red-200 transition-all cursor-pointer">
                    登出
                </button>
            </div>
        </div>

        <!-- Close Button -->
        <button id="logoutClose"
            class="absolute top-4 right-4 p-2 text-textMuted hover:text-text hover:bg-gray-100 rounded-full transition-colors cursor-pointer">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
    </div>
</div>
            </div>
        </header>

        <!-- 翻譯設定與操作區塊 -->
        <div class="flex-1 overflow-hidden p-8 flex flex-col items-center">

            <!-- 工作區 白色 Panel -->
            <div
                class="w-full max-w-5xl bg-surface border border-border rounded-xl shadow-sm flex flex-col md:flex-row h-full overflow-hidden">

                <!-- 功能分頁 (Tab/Menu): 左側區域 -->
                <div class="w-full md:w-56 border-r border-border bg-gray-50 flex flex-col p-4 flex-shrink-0">
                    <h3 class="text-[11px] font-bold text-textMuted uppercase tracking-wider mb-4 px-3">功能切換</h3>
                    <div class="space-y-1.5">
                        <a href="translation.html"
                            class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg bg-primary/10 text-primary font-bold transition-colors text-sm">
                            <i data-lucide="settings-2" class="w-4 h-4"></i>
                            <span>輸入設定</span>
                        </a>
                        <a href="translation-history.html"
                            class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-textMuted hover:bg-gray-200 hover:text-text transition-colors font-medium text-sm">
                            <i data-lucide="history" class="w-4 h-4"></i>
                            <span>上傳紀錄</span>
                        </a>
                    </div>
                </div>

                <!-- 核心表單操作區: 右側區域 -->
                <div class="flex-1 p-8 overflow-y-auto">
                    <div class="max-w-2xl mx-auto">
                        <h3 class="text-xl font-bold text-text mb-8">文件翻譯 - 輸入設定</h3>

                        <form class="space-y-8" onsubmit="event.preventDefault();">

                            <!-- 檔案上傳控制 -->
                            <div>
                                <label class="block text-sm font-bold text-text mb-2">
                                    上傳檔案 <span class="text-red-500">*</span>
                                </label>
                                <div
                                    class="mt-2 flex justify-center px-6 pt-10 pb-10 border-2 border-dashed border-gray-300 rounded-xl hover:border-primary hover:bg-blue-50/30 transition-all cursor-pointer group">
                                    <div class="space-y-2 text-center flex flex-col items-center">
                                        <div
                                            class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-primary mb-3 group-hover:scale-110 group-hover:bg-blue-100 transition-all duration-300">
                                            <i data-lucide="upload-cloud" class="w-6 h-6"></i>
                                        </div>
                                        <div class="text-sm text-textMuted flex items-center">
                                            <label for="file-upload"
                                                class="relative cursor-pointer rounded-md font-semibold text-primary hover:text-primaryHover focus-within:outline-none focus:underline">
                                                <span>點擊選擇檔案</span>
                                                <input id="file-upload" name="file-upload" type="file" class="sr-only">
                                            </label>
                                            <span class="ml-1">或將拖曳檔案至此區域</span>
                                        </div>
                                        <p class="text-xs text-textMuted/80 font-medium">
                                            支援 .docx, .pdf, .pptx, .xlsx, .html, .txt 格式
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <!-- 語言選擇器 -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="flex items-center text-sm font-bold text-text mb-2">
                                        文件原始語言 <span class="text-red-500 ml-1">*</span>
                                    </label>
                                    <div class="relative">
                                        <select
                                            class="block w-full appearance-none rounded-lg border border-border bg-white py-2.5 pl-4 pr-10 text-sm text-text focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors">
                                            <option value="">請選擇原始語言</option>
                                            <option value="zh">中文</option>
                                            <option value="en">英文</option>
                                            <option value="vi">越南文</option>
                                        </select>
                                        <div
                                            class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-textMuted">
                                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label class="flex items-center text-sm font-bold text-text mb-2">
                                        欲翻譯語言 <span class="text-red-500 ml-1">*</span>
                                    </label>
                                    <div class="relative">
                                        <select
                                            class="block w-full appearance-none rounded-lg border border-border bg-white py-2.5 pl-4 pr-10 text-sm text-text focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors">
                                            <option value="">請選擇目標語言</option>
                                            <option value="zh">中文</option>
                                            <option value="en">英文</option>
                                            <option value="vi">越南文</option>
                                        </select>
                                        <div
                                            class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-textMuted">
                                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <hr class="border-border my-6">

                            <!-- 進一步處理或動作觸發 -->
                            <div class="flex items-center justify-end space-x-4 pt-2">
                                <!-- Disabled 下載按鈕 (尚未處理完成) -->
                                <button type="button"
                                    class="px-5 py-2.5 flex items-center rounded-lg border border-border bg-gray-50 text-gray-400 font-bold text-sm cursor-not-allowed transition-colors"
                                    disabled title="處理完成後開放下載">
                                    <i data-lucide="downloadCloud" class="w-4 h-4 mr-2"></i>
                                    下載
                                </button>
                                <!-- 送出按鈕 -->
                                <button type="submit"
                                    class="px-5 py-2.5 flex items-center rounded-lg bg-primary text-white font-bold text-sm hover:bg-primaryHover transition-colors shadow-sm">
                                    <i data-lucide="send" class="w-4 h-4 mr-2"></i>
                                    送出
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="js/components.js"></script>
</body>

</html>
